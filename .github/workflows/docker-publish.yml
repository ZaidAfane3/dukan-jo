name: Build and push Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Nothing in these goes into the image, so changing only them neither builds nor deploys.
    paths-ignore: ["docs/**", "prototype/**", "demo logo/**", "**/*.md"]
  # Pull requests only run the type check (the `check` job), so mistakes show before merging.
  pull_request:
    branches: [main]
    paths-ignore: ["docs/**", "prototype/**", "demo logo/**", "**/*.md"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # The type check runs here, next to the image build, instead of inside it (the Dockerfile sets SKIP_CHECKS=1), so
  # the two overlap. Deploy waits for both.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  build-and-push:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}

      # Next.js's build cache (.next/cache) normally lives in a BuildKit cache mount, which a fresh CI runner never has.
      # These two steps keep it in GitHub's cache and put it back into the mount, so a build only recompiles what changed.
      - id: next-cache
        uses: actions/cache@v4
        with:
          path: next-cache
          key: next-cache-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: next-cache-${{ hashFiles('package-lock.json') }}-

      - uses: reproducible-containers/buildkit-cache-dance@v3.1.2
        with:
          cache-map: |
            {"next-cache": {"target": "/app/.next/cache", "id": "next-cache"}}
          skip-extraction: ${{ steps.next-cache.outputs.cache-hit }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # After the image is pushed, reach the server over Tailscale SSH and switch the app to it.
  deploy:
    needs: [check, build-and-push]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false   # queue deploys, never cut one off half way
    env:
      DEPLOY_HOST: vm01.tailf2b855.ts.net
      DEPLOY_USER: zaidafaneh
      DEPLOY_DIR: /home/zaidafaneh/projects/UnderDevelepoment/dukan-jo
    steps:
      - name: Join the tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # Only when the server's checkout has no deploy/deploy.sh yet (the very first run) is it updated here; normally the
      # script does the checkout itself, so it can tell what was live before and roll back to it.
      - name: Deploy over Tailscale SSH
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_DIR' && git fetch origin main && { [ -x deploy/deploy.sh ] || git checkout --detach '${{ github.sha }}'; } && ./deploy/deploy.sh '${{ github.sha }}'"
