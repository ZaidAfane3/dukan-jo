services:
  app:
    build: .
    image: dukkan-jo
    container_name: dukkan-jo
    # Localhost only: visitors arrive through the Cloudflare tunnel, which reaches the app over the
    # cloudflared_default network, so the port never needs to be open to the internet.
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgres://dukkan:${POSTGRES_PASSWORD:-dukkan-local-only}@db:5432/dukkan
      # Diwan (staff console): the key that lets /diwan/login create the first owner while there is no staff yet.
      # Put DIWAN_SETUP_KEY=a-long-random-key in .env; once the owner exists it does nothing (and can be removed).
      DIWAN_SETUP_KEY: ${DIWAN_SETUP_KEY:-}
      # The key for encrypting stored data. Put DUKKAN_DATA_KEY=$(openssl rand -base64 32) in .env; keep it safe and
      # never change it once data has been saved with it.
      DUKKAN_DATA_KEY: ${DUKKAN_DATA_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - cloudflared_default

  # Accounts and every store's saved data. Only the app can reach it (no ports are opened to the outside), and the
  # data lives in the dukkan-db volume, so rebuilds and restarts never lose it. Set POSTGRES_PASSWORD in a .env file
  # next to this one before the first start (see docs/database.md).
  db:
    image: postgres:16-alpine
    container_name: dukkan-db
    environment:
      POSTGRES_USER: dukkan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dukkan-local-only}
      POSTGRES_DB: dukkan
    volumes:
      - dukkan-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dukkan -d dukkan"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - default

volumes:
  dukkan-db:

networks:
  cloudflared_default:
    external: true
